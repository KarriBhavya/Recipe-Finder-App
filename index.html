<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Finder</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    background:#ff6b6b;
    color:white;
    text-align:center;
    padding:20px;
}

.search-box{
    text-align:center;
    margin:20px;
}

.search-box input{
    width:300px;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

.search-box button{
    padding:10px 20px;
    border:none;
    background:#ff6b6b;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

.recipe-container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:20px;
}

.card{
    width:250px;
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.card-content{
    padding:15px;
}

.card-content h3{
    margin-bottom:10px;
}

.card-content p{
    color:#666;
}
</style>
</head>
<body>

<header>
    <h1>🍲 Recipe Finder App</h1>
</header>

<div class="search-box">
    <input type="text" placeholder="Search recipes...">
    <button>Search</button>
</div>

<div class="recipe-container">

    <div class="card">
        <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c" alt="Salad">
        <div class="card-content">
            <h3>Healthy Salad</h3>
            <p>Fresh vegetables with healthy dressing.</p>
        </div>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591" alt="Pizza">
        <div class="card-content">
            <h3>Cheese Pizza</h3>
            <p>Delicious cheesy pizza with toppings.</p>
        </div>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38" alt="Burger">
        <div class="card-content">
            <h3>Classic Burger</h3>
            <p>Juicy burger with crispy fries.</p>
        </div>
    </div>

</div>

</body>
</html>
